openapi: 3.0.3
info:
  title: CLOSET STUDIO API
  version: 1.0.0
  description: "Dự án SE1909_G5_SDN302_FinalProject (CLOSET STUDIO) là website
    thương mại điện tử bán quần áo, phục vụ bài tập lớn môn SDN302. Khách hàng
    xem danh mục, tìm kiếm, lọc, sắp xếp, quản lý giỏ hàng và danh sách yêu
    thích, đặt hàng, đánh giá và bình luận. Nhân viên và quản trị viên quản lý
    sản phẩm, phân loại, đơn hàng, mã giảm giá, người dùng và thống kê.\r

    \r

    Công nghệ sử dụng:\r

    \r

    - Backend: Node.js và Express 5.\r

    - Cơ sở dữ liệu: MongoDB với Mongoose.\r

    - Frontend: React 19, Vite, React Router 7, Axios, react-hot-toast,
    lucide-react và Chart.js.\r

    - Xác thực: JWT (jsonwebtoken) qua header Authorization Bearer; mật khẩu
    được băm bằng bcryptjs trong hook pre-save của model User; phân quyền bằng
    middleware protect, isAdmin và isStaffOrAdmin. Dashboard quản trị render
    bằng EJS dùng cookie httpOnly admin_token.\r

    - Thư viện và dịch vụ khác: Cloudinary và Multer cho ảnh sản phẩm và avatar,
    Nodemailer cho email đặt lại mật khẩu, CORS, cookie-parser, dotenv, và
    Swagger UI (OpenAPI 3) tại /api-docs.\r

    \r

    Hệ thống đăng ký đúng 96 endpoint. Mỗi endpoint là một cặp phương thức HTTP
    và đường dẫn sau khi gắn prefix trong server.js. Router đánh giá được mount
    tại /api và /api/reviews, mỗi nơi 8 đường dẫn. Router bình luận được mount
    tại /api và /api/comments; 5 handler gắn tại /api trùng phương thức và đường
    dẫn với router đánh giá (Express khớp router đánh giá trước) nên không tính
    thêm endpoint. Phân bổ:\r

    \r

    - Hệ thống: 1 (GET /)\r

    - Giao diện Admin EJS: 7\r

    - Người dùng: 14 (xác thực 5, gồm quên mật khẩu và đặt lại mật khẩu; hồ sơ
    4; địa chỉ 5)\r

    - Yêu thích: 4\r

    - Đánh giá: 16\r

    - Bình luận: 5\r

    - Mã giảm giá: 6\r

    - Sản phẩm: 9\r

    - Danh mục: 5\r

    - Thương hiệu: 5\r

    - Giỏ hàng: 5\r

    - Wishlist: 4\r

    - Đơn hàng: 7\r

    - Quản trị người dùng: 7\r

    - Thống kê: 1"
servers:
  - url: http://localhost:5000
    description: Máy phát triển cục bộ
  - url: /
    description: Máy chủ hiện tại
tags:
  - name: Hệ thống
  - name: Giao diện Admin
  - name: Xác thực
  - name: Hồ sơ
  - name: Địa chỉ
  - name: Yêu thích
  - name: Đánh giá
  - name: Mã giảm giá
  - name: Sản phẩm
  - name: Danh mục
  - name: Thương hiệu
  - name: Bình luận
  - name: Giỏ hàng
  - name: Wishlist
  - name: Đơn hàng
  - name: Quản trị người dùng
  - name: Thống kê
paths:
  /:
    get:
      tags:
        - Hệ thống
      summary: Kiểm tra API đang chạy
      description: Không yêu cầu đăng nhập.
      security: []
      responses:
        "200":
          description: Chuỗi thông báo API đang chạy
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /admin/logout:
    post:
      tags:
        - Giao diện Admin
      summary: Đăng xuất dashboard EJS và xóa cookie admin_token
      description: Không yêu cầu đăng nhập.
      security: []
      responses:
        "200":
          description: Chuyển hướng hoặc trang xác nhận đăng xuất
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Chuyển hướng sau khi đăng xuất
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /admin:
    get:
      tags:
        - Giao diện Admin
      summary: Chuyển tới dashboard
      description: Yêu cầu cookie httpOnly admin_token của tài khoản admin. Thiếu
        quyền thì chuyển hướng về trang đăng nhập.
      security:
        - adminCookie: []
      responses:
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
  /admin/dashboard:
    get:
      tags:
        - Giao diện Admin
      summary: Trang tổng quan EJS
      description: Yêu cầu cookie httpOnly admin_token của tài khoản admin. Thiếu
        quyền thì chuyển hướng về trang đăng nhập.
      security:
        - adminCookie: []
      responses:
        "200":
          description: HTML dashboard
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
  /admin/users:
    get:
      tags:
        - Giao diện Admin
      summary: Trang quản lý người dùng EJS
      description: Yêu cầu cookie httpOnly admin_token của tài khoản admin. Thiếu
        quyền thì chuyển hướng về trang đăng nhập.
      security:
        - adminCookie: []
      responses:
        "200":
          description: HTML danh sách người dùng
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
  /admin/users/{id}/role:
    post:
      tags:
        - Giao diện Admin
      summary: Đổi vai trò người dùng từ form EJS
      description: Yêu cầu cookie httpOnly admin_token của tài khoản admin. Thiếu
        quyền thì chuyển hướng về trang đăng nhập.
      security:
        - adminCookie: []
      responses:
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Định danh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  description: customer, staff hoặc admin
                  enum:
                    - customer
                    - staff
                    - admin
  /admin/users/{id}/delete:
    post:
      tags:
        - Giao diện Admin
      summary: Xóa người dùng từ form EJS
      description: Yêu cầu cookie httpOnly admin_token của tài khoản admin. Thiếu
        quyền thì chuyển hướng về trang đăng nhập.
      security:
        - adminCookie: []
      responses:
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Định danh
  /admin/coupons:
    get:
      tags:
        - Giao diện Admin
      summary: Trang mã giảm giá EJS
      description: Yêu cầu cookie httpOnly admin_token của tài khoản admin. Thiếu
        quyền thì chuyển hướng về trang đăng nhập.
      security:
        - adminCookie: []
      responses:
        "200":
          description: HTML mã giảm giá
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Chuyển về trang đăng nhập khi thiếu cookie, token hết hạn hoặc
            không phải admin
  /api/users/register:
    post:
      tags:
        - Xác thực
      summary: Đăng ký tài khoản customer
      description: Không yêu cầu đăng nhập.
      security: []
      responses:
        "201":
          description: Tạo tài khoản và trả JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Thiếu trường hoặc dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Email đã được dùng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  description: Họ tên, 2 đến 100 ký tự
                email:
                  type: string
                  description: Email
                password:
                  type: string
                  description: Mật khẩu, tối thiểu 6 ký tự
  /api/users/login:
    post:
      tags:
        - Xác thực
      summary: Đăng nhập và nhận JWT
      description: Không yêu cầu đăng nhập.
      security: []
      responses:
        "200":
          description: Đăng nhập thành công. Admin còn nhận cookie admin_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Thiếu email hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Email hoặc mật khẩu không đúng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: Tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  description: Email
                password:
                  type: string
                  description: Mật khẩu
  /api/users/logout:
    post:
      tags:
        - Xác thực
      summary: Đăng xuất và xóa cookie admin_token
      description: Không yêu cầu đăng nhập.
      security: []
      responses:
        "200":
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/users/forgot-password:
    post:
      tags:
        - Xác thực
      summary: Gửi email đặt lại mật khẩu
      description: Không yêu cầu đăng nhập.
      security: []
      responses:
        "200":
          description: Luôn cùng một thông báo, không tiết lộ email có tồn tại hay không
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Email không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  description: Email tài khoản
  /api/users/reset-password/{token}:
    post:
      tags:
        - Xác thực
      summary: Đặt mật khẩu mới bằng token một lần
      description: Không yêu cầu đăng nhập.
      security: []
      responses:
        "200":
          description: Đổi mật khẩu thành công và hủy token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token không hợp lệ, hết hạn, đã dùng, hoặc mật khẩu quá ngắn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            description: Token đặt lại mật khẩu, 64 ký tự hex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  description: Mật khẩu mới, tối thiểu 6 ký tự
  /api/users/profile:
    get:
      tags:
        - Hồ sơ
      summary: Lấy hồ sơ người dùng hiện tại
      description: Yêu cầu Bearer JWT.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hồ sơ, không gồm mật khẩu và token đặt lại mật khẩu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    put:
      tags:
        - Hồ sơ
      summary: Cập nhật họ tên
      description: Yêu cầu Bearer JWT.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Hồ sơ đã cập nhật và JWT mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Họ tên không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Họ tên mới, 2 đến 100 ký tự
  /api/users/change-password:
    put:
      tags:
        - Hồ sơ
      summary: Đổi mật khẩu khi đang đăng nhập
      description: Yêu cầu Bearer JWT.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Đổi mật khẩu thành công, trả JWT mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Mật khẩu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  description: Mật khẩu hiện tại
                newPassword:
                  type: string
                  description: Mật khẩu mới, tối thiểu 6 ký tự, khác mật khẩu cũ
  /api/users/upload-avatar:
    post:
      tags:
        - Hồ sơ
      summary: Tải ảnh đại diện lên Cloudinary
      description: Yêu cầu Bearer JWT.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: URL avatar mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Tệp không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "413":
          description: Vượt quá 2MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPEG, PNG hoặc WEBP, tối đa 2MB
  /api/users/addresses:
    get:
      tags:
        - Địa chỉ
      summary: Danh sách địa chỉ nhận hàng
      description: Yêu cầu Bearer JWT của customer.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Mảng địa chỉ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: Không đủ quyền
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    post:
      tags:
        - Địa chỉ
      summary: Thêm địa chỉ nhận hàng
      description: Yêu cầu Bearer JWT của customer.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Danh sách địa chỉ sau khi thêm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Thiếu trường hoặc số điện thoại không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: Không đủ quyền
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - street
                - city
                - state
                - phone
              properties:
                street:
                  type: string
                  description: Số nhà, đường
                city:
                  type: string
                  description: Phường, xã
                state:
                  type: string
                  description: Quận, tỉnh
                phone:
                  type: string
                  description: Số điện thoại Việt Nam
                isDefault:
                  type: boolean
                  description: Đặt làm địa chỉ mặc định
  /api/users/addresses/{addressId}:
    put:
      tags:
        - Địa chỉ
      summary: Cập nhật một địa chỉ
      description: Yêu cầu Bearer JWT của customer.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách địa chỉ sau khi sửa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Thiếu token, token hết hạn hoặc mật khẩu đã đổi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: Không đủ quyền
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Không tìm thấy địa chỉ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
