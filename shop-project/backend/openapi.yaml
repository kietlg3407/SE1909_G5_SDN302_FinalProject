components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT trả về từ đăng nhập hoặc đăng ký. Gửi header Authorization:
        Bearer <token>."
    adminCookie:
      type: apiKey
      in: cookie
      name: admin_token
      description: Cookie httpOnly tạo khi admin đăng nhập, dùng cho các trang EJS /admin.
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
        success:
          type: boolean
    UserProfile:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - customer
            - staff
            - admin
        isActive:
          type: boolean
        avatar:
          type: string
        addresses:
          type: array
          items:
            type: object
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/UserProfile"
        - type: object
          properties:
            token:
              type: string
